<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API Key Server</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:#0b1020;color:#edf2ff}
    *{box-sizing:border-box}[hidden]{display:none!important}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top left,rgba(111,76,255,.22),transparent 35%),radial-gradient(circle at bottom right,rgba(23,193,178,.16),transparent 35%),#0b1020}
    .card{width:min(100%,480px);padding:32px;border:1px solid #273252;border-radius:20px;background:rgba(18,25,45,.94);box-shadow:0 24px 70px rgba(0,0,0,.35)}
    h1{margin:0 0 8px;font-size:clamp(1.7rem,5vw,2.2rem)}
    .intro{margin:0 0 24px;color:#aeb9d6;line-height:1.55}
    label{display:block;margin-bottom:9px;font-weight:700}
    input{width:100%;padding:14px;border:1px solid #39476d;border-radius:12px;outline:0;background:#0d1428;color:#fff;font:inherit}
    input:focus-visible{box-shadow:0 0 0 2px #8c7dff}
    button{border:0;border-radius:10px;padding:12px 16px;color:#fff;background:#6554e8;font:inherit;font-weight:700;cursor:pointer}
    button:hover{filter:brightness(1.1)}button:focus-visible{outline:3px solid #b8afff;outline-offset:2px}
    .pin-submit,.copy{width:100%;margin-top:14px}.error{min-height:1.5em;margin:12px 0 0;color:#ff91a8}
    .top-actions{display:flex;justify-content:flex-end;gap:8px;margin-bottom:18px}.secondary{background:#202c4b}
    .key-panel{padding:16px;border:1px solid #39476d;border-radius:12px;background:#0d1428}
    .key-panel strong{display:block;margin-bottom:9px}.key{display:block;overflow-wrap:anywhere;color:#b8afff;user-select:all}
    .status{min-height:1.5em;margin:14px 0 0;color:#7ee0c8}
    .notice{margin-top:20px;padding:13px 14px;border-left:3px solid #f1b44c;border-radius:6px;background:rgba(241,180,76,.08);color:#d7dced;font-size:.9rem;line-height:1.5}
  </style>
</head>
<body>
  <section class="card" id="pinGate">
    <h1 id="pinTitle">Unlock API Key Server</h1>
    <p class="intro" id="pinHelp">Enter your PIN to continue.</p>
    <form id="pinForm">
      <label for="pinInput">PIN</label>
      <input id="pinInput" type="password" autocomplete="off" minlength="4" required>
      <button class="pin-submit" id="pinSubmit" type="submit">Unlock</button>
    </form>
    <p class="error" id="pinError" role="alert"></p>
  </section>

  <main class="card" id="app" hidden>
    <div class="top-actions">
      <button class="secondary" id="changePin" type="button">Change PIN</button>
      <button class="secondary" id="lockPage" type="button">Lock</button>
    </div>
    <h1>API Key Server</h1>
    <p class="intro">This shared value is loaded from <code>env.js</code>.</p>
    <div class="key-panel">
      <strong>Shared API key</strong>
      <code class="key" id="savedKey"></code>
      <button class="copy" id="copyKey" type="button">Copy key</button>
    </div>
    <p class="status" id="status" role="status"></p>
    <div class="notice"><strong>Security note:</strong> a key in <code>env.js</code> is public to anyone who can access the site. Use provider-side restrictions and never publish an unrestricted production key.</div>
  </main>

  <script src="env.js"></script>
  <script>
    const PIN_KEY="api_key_server_pin_hash";
    const pinGate=document.querySelector("#pinGate"),app=document.querySelector("#app"),pinForm=document.querySelector("#pinForm"),pinInput=document.querySelector("#pinInput"),pinTitle=document.querySelector("#pinTitle"),pinHelp=document.querySelector("#pinHelp"),pinSubmit=document.querySelector("#pinSubmit"),pinError=document.querySelector("#pinError"),status=document.querySelector("#status");
    const sharedKey=window.API_KEY_ENV?.GEMINI_API_KEY||"";
    document.querySelector("#savedKey").textContent=sharedKey||"No key configured in env.js";

    async function hashPin(pin){const bytes=new TextEncoder().encode(pin);const digest=await crypto.subtle.digest("SHA-256",bytes);return Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,"0")).join("")}
    function configureGate(){const creating=!localStorage.getItem(PIN_KEY);pinTitle.textContent=creating?"Create a PIN":"Unlock API Key Server";pinHelp.textContent=creating?"Create a PIN with at least 4 characters.":"Enter your PIN to continue.";pinSubmit.textContent=creating?"Create PIN":"Unlock";pinInput.value="";pinError.textContent=""}
    function unlock(){pinGate.hidden=true;app.hidden=false}
    function lock(){app.hidden=true;pinGate.hidden=false;configureGate()}

    pinForm.addEventListener("submit",async event=>{event.preventDefault();const pin=pinInput.value;if(pin.length<4){pinError.textContent="PIN must contain at least 4 characters.";return}const entered=await hashPin(pin),stored=localStorage.getItem(PIN_KEY);if(!stored){localStorage.setItem(PIN_KEY,entered);unlock()}else if(entered===stored){unlock()}else{pinError.textContent="Incorrect PIN. Please try again.";pinInput.select()}});
    document.querySelector("#lockPage").addEventListener("click",lock);
    document.querySelector("#changePin").addEventListener("click",async()=>{const current=prompt("Enter your current PIN:");if(current===null)return;if(await hashPin(current)!==localStorage.getItem(PIN_KEY)){alert("Incorrect current PIN.");return}const replacement=prompt("Enter a new PIN (at least 4 characters):");if(replacement===null)return;if(replacement.length<4){alert("The new PIN must contain at least 4 characters.");return}localStorage.setItem(PIN_KEY,await hashPin(replacement));alert("PIN changed successfully.")});
    document.querySelector("#copyKey").addEventListener("click",async()=>{if(!sharedKey)return;await navigator.clipboard.writeText(sharedKey);status.textContent="API key copied."});
    configureGate();
  </script>
</body>
</html>
